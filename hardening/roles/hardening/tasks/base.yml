---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - needrestart
      - chrony
      - curl
      - ca-certificates
      - gnupg
      - iproute2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Turn on daily package lists and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by the hardening baseline (hardening/)
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

- name: Configure unattended upgrades (reboot window, extra origins)
  ansible.builtin.template:
    src: 52hardening-unattended.j2
    dest: /etc/apt/apt.conf.d/52hardening-unattended
    mode: "0644"

- name: Remove the older copy written by scripts/setup.sh
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/52mailserver-unattended
    state: absent

- name: Let needrestart restart services after library updates without asking
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/50-hardening.conf
    content: |
      # Managed by the hardening baseline (hardening/)
      $nrconf{restart} = 'a';
    mode: "0644"

- name: Set the time zone
  community.general.timezone:
    name: "{{ hardening_timezone }}"

- name: Keep the clock synchronised
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Create journald's drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Keep the journal across reboots (evidence after an incident)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-hardening.conf
    content: |
      # Managed by the hardening baseline (hardening/)
      [Journal]
      Storage=persistent
      SystemMaxUse=1G
    mode: "0644"
  notify: Restart journald

- name: Kernel network settings
  # Deliberately short. ip_forward and rp_filter are left alone: Docker and
  # Tailscale need them as they are. IPv6 keys are skipped where IPv6 is off.
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-hardening.conf
    content: |
      # Managed by the hardening baseline (hardening/)
      net.ipv4.tcp_syncookies = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      -net.ipv6.conf.all.accept_redirects = 0
      -net.ipv6.conf.default.accept_redirects = 0
      -net.ipv6.conf.all.accept_source_route = 0
      kernel.kptr_restrict = 2
      kernel.dmesg_restrict = 1
    mode: "0644"
  notify: Apply kernel settings
