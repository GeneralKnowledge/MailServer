---
# With key-only SSH a ban protects nothing a guess could reach; it cuts log
# noise and connection load, and recidive keeps repeat scanners out for a week.
# Mail logins on the mailcow host are covered by mailcow's own netfilter.
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure the sshd and recidive jails
  ansible.builtin.template:
    src: fail2ban-hardening.local.j2
    dest: /etc/fail2ban/jail.d/hardening.local
    mode: "0644"
  notify: Restart fail2ban

- name: Run fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
