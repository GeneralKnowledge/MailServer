---
- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload sshd  # noqa: command-instead-of-module
  # try-reload: on Ubuntu 24.04 ssh.service may not be running yet (socket activation).
  ansible.builtin.command: systemctl try-reload-or-restart ssh.service
  changed_when: true

- name: Reload ufw
  ansible.builtin.command: ufw reload
  changed_when: true

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Apply kernel settings
  ansible.builtin.command: sysctl -e -p /etc/sysctl.d/60-hardening.conf
  changed_when: true
