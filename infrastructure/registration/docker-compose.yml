# Invite registration app and provisioning broker, deployed separately from mailcow.
# Both sit on the small internal avedeus-edge network (scripts/create-edge-network.sh),
# which mailcow's nginx also joins (see the mailcow docker-compose.override.yml):
#   * mailcow's nginx proxies https://mail.<domain>/join/ to the registration app,
#   * the app asks the broker (the control plane) to check addresses and create mailboxes, and
#   * the broker, the only holder of the mailcow API key, calls the API
#     through nginx-mailcow. The key is allow-listed to the broker's address.
# Neither is on mailcow's own network: Postfix trusts every address there to
# send mail without a password. On avedeus-edge they have no route to the
# internet either. mailcow updates don't touch this project.
services:
  registration:
    build: ../../registration
    image: mailserver-registration:local
    env_file: .env
    restart: unless-stopped
    volumes:
      - registration-data:/data
    networks:
      edge:
        # Fixed address: the broker only accepts calls from it.
        ipv4_address: 172.30.240.10
        aliases: [registration]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    depends_on: [broker]

  broker:
    build: ../../broker
    image: mailserver-broker:local
    env_file: broker.env   # holds the mailcow API key; the registration app never reads it
    restart: unless-stopped
    volumes:
      - control-plane-data:/data   # its own database: audit log, idempotency records
    networks:
      edge:
        # Fixed address: mailcow's API_ALLOW_FROM lists only this one.
        ipv4_address: 172.30.240.11
        aliases: [broker]
    # No ports published: reachable only on avedeus-edge.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 50
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  portal:
    # PR 14. Only with Keycloak (ADR 0006 gate): docker compose --profile identity up -d portal
    profiles: ["identity"]
    build: ../../portal
    image: mailserver-portal:local
    env_file: portal.env   # its Keycloak client secret and control-plane token; no upstream credential
    restart: unless-stopped
    networks:
      edge:
        # Fixed address: the control plane only accepts the portal caller from it.
        ipv4_address: 172.30.240.13
        aliases: [portal]
    # No volume: sessions live in memory, nothing to back up.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    depends_on: [broker]

volumes:
  registration-data:
  control-plane-data:

networks:
  edge:
    external: true
    name: avedeus-edge
