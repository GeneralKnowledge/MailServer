# Invite registration app, deployed separately from mailcow.
# It sits on the small internal avedeus-edge network (scripts/create-edge-network.sh),
# which mailcow's nginx also joins (see the mailcow docker-compose.override.yml):
#   * mailcow's nginx proxies https://mail.<domain>/join/ to it, and
#   * it reaches the mailcow API through nginx-mailcow on that network.
# It is deliberately NOT on mailcow's own network: Postfix trusts every
# address there to send mail without a password. On avedeus-edge it has no
# route to the internet either. mailcow updates don't touch this project.
services:
  registration:
    build: ../../registration
    image: mailserver-registration:local
    env_file: .env
    restart: unless-stopped
    volumes:
      - registration-data:/data
    networks:
      edge:
        # Fixed address: nginx forwards client IPs only from .2, and the
        # mailcow API key is allow-listed to this one.
        ipv4_address: 172.30.240.10
        aliases: [registration]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  registration-data:

networks:
  edge:
    external: true
    name: avedeus-edge
