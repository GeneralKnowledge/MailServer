# Lazy expunge (gap audit O1, PR 29): mail a person deletes and empties from
# the trash is kept in a hidden-until-used ".EXPUNGED" folder for 7 days, so
# they (or an admin) can move it back. mailcow's own documented option:
# https://docs.mailcow.email/manual-guides/Dovecot/u_e-dovecot-lazy_expunge/
# (marked "work in progress" there: check it on the server before relying on it).
# Copy to /opt/mailcow-dockerized/data/conf/dovecot/extra.conf (merge by hand if
# one exists; mailcow keeps this file out of git), then:
#   docker compose restart dovecot-mailcow
namespace inbox {
    mailbox .EXPUNGED {
        autoexpunge = 7days
        autoexpunge_max_mails = 100000
    }
}
protocol imap {
    mail_plugins = $mail_plugins lazy_expunge
}
plugin {
    lazy_expunge = .EXPUNGED
    lazy_expunge_mailbox = .EXPUNGED
    lazy_expunge_only_last_instance = yes
    # Kept mail does not count against the quota.
    quota_rule = .EXPUNGED:ignore
}
