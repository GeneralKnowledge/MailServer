# Who may call which control-plane operation (ADR 0003, 0010).
#
# This is the table the control plane enforces from PR 9.
#
# Today (before PR 9) there is NO per-caller separation. The broker accepts
# one shared BROKER_TOKEN from the addresses in BROKER_ALLOWED_CLIENTS, and
# any holder of that token can call every route the broker has. The sign-up
# app is the only HTTP client. health-check.sh does not call the broker's API:
# it runs `python -m broker.selfcheck` inside the broker container, which
# checks the mailcow key directly. The `signup` row holds today only because
# the broker offers no other state-changing route; the `monitoring` row
# describes the caller PR 9/13 will create and is not enforced at all.
# `enforced: false` marks this. PR 9 gives each caller its own credential and
# enforces these rows; it must then set `enforced: true`.
#
# CI (contracts/tests) checks that:
#   - every operation named here exists in control-plane.openapi.yaml,
#   - every operation in the contract is granted to some caller,
#   - `signup` is never granted a lifecycle, alias or audit operation,
#   - only `admin` gets lifecycle and audit operations,
#   - `monitoring` gets health operations only.
#
# Changing a row is an architecture change: name it in the PR description.
version: 1

callers:
  signup:
    description: Public invitation sign-up at /join (registration/).
    credential: Bearer token + source IP on avedeus-edge
    subject_from: the invitation, never a request field
    status: existing client of the broker, on the shared token
    enforced: false     # per-caller enforcement arrives in PR 9
    operations:
      - checkAddress
      - createMailbox       # replaced by createAccount in PR 12
      - createAccount       # planned, PR 12

  portal:
    description: Signed-in user's own account at /account (PR 14).
    credential: Service credential + the user's Keycloak access token
    subject_from: verified Keycloak token (sub), never a request field
    status: planned
    enforced: false
    operations:
      - listOwnAliases
      - createOwnAlias
      - updateOwnAlias
      - deleteOwnAlias
      # Rules (PR 23/24, blocked on ADR 0014), privacy (PR 20) and
      # notifications (PR 26) add their operations here when designed.

  admin:
    description: Admin console in its own container at /admin (PR 15).
    credential: Service credential + admin's Keycloak token in the admin group, TOTP, allowed IP
    subject_from: verified Keycloak token
    status: planned
    enforced: false
    operations:
      - listAccounts
      - getAccount
      - suspendAccount
      - reactivateAccount
      - setAccountQuota
      - forcePasswordReset
      - scheduleDeletion
      - cancelDeletion
      - readAudit

  pm-token:
    description: Password managers (Bitwarden etc.) acting for one user.
    credential: Per-user token, hashed at rest, revocable
    subject_from: the token's owner
    status: planned
    enforced: false
    operations:
      - pmCreateRandomAliasSimpleLoginShape
      - pmCreateAliasAddyShape

  personal-token:
    description: Personal API tokens and the MCP server (M10, PR 32). A subset of portal, read-only first.
    credential: Per-user scoped, IP-limited, short-lived token
    subject_from: the token's owner
    status: planned
    enforced: false
    operations:
      - listOwnAliases

  monitoring:
    description: health-check.sh and the PR 13 health contract, once they call the control plane over HTTP. Reads mailcow itself with its own read-only key (PR 27).
    credential: Bearer token + source IP
    subject_from: n/a
    status: planned caller. upstreamCheck exists, but nothing calls it over HTTP yet; health-check.sh uses broker.selfcheck inside the container instead
    enforced: false     # no separate monitoring credential until PR 9
    operations:
      - upstreamCheck
      - health

# Operations that need no caller credential at all.
public:
  - healthz

# Groups used by the CI checks.
lifecycle_operations:
  - suspendAccount
  - reactivateAccount
  - setAccountQuota
  - forcePasswordReset
  - scheduleDeletion
  - cancelDeletion
