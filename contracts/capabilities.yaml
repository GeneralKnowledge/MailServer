# Who may call which control-plane operation (ADR 0003, 0010).
#
# Enforced since PR 9 for the rows marked `enforced: true`: each such caller
# has its own token and source addresses (broker.env: <NAME>_TOKEN and
# <NAME>_CLIENTS) and may use only the implemented operations listed here.
# The control plane holds a Python copy (broker/broker/capabilities.py) so its
# image needs nothing from outside broker/; CI fails if the two differ.
# Planned operations in an enforced row become usable only when built.
#
# CI (contracts/tests) checks that:
#   - every operation named here exists in control-plane.openapi.yaml,
#   - every operation in the contract is granted to some caller,
#   - `signup` is never granted a lifecycle, alias or audit operation,
#   - only `admin` gets lifecycle and audit operations,
#   - `monitoring` gets health operations only,
#   - the enforced rows match broker/broker/capabilities.py exactly, and the
#     running control plane answers 401/403/allowed as these rows say.
#
# Changing a row is an architecture change: name it in the PR description.
version: 1

callers:
  signup:
    description: Public invitation sign-up at /join (registration/).
    credential: Bearer token + source IP on avedeus-edge
    subject_from: the invitation, never a request field
    status: implemented (SIGNUP_TOKEN, SIGNUP_CLIENTS)
    enforced: true
    operations:
      - checkAddress
      - createMailbox       # superseded by createAccount; refused when Keycloak is on
      - createAccount       # PR 12: identity, then mailbox

  portal:
    description: Signed-in user's own account at /account (PR 14).
    credential: Service credential + the user's Keycloak access token
    subject_from: verified Keycloak token (sub), never a request field
    status: planned
    enforced: false
    operations:
      # Alias operations: PR 10 is parked (2026-11-15). Kept as a sketch,
      # not a planned deliverable; see roadmap "Possible future work".
      - listOwnAliases
      - createOwnAlias
      - updateOwnAlias
      - deleteOwnAlias
      # Notifications (PR 26) add their operations here when designed.
      # PR 20 (privacy) adds none: it is configuration and links only.
      # Rules (PR 23-25) are dropped: SOGo owns them (ADR 0014).

  admin:
    description: Admin console in its own container at /admin (PR 15).
    credential: Service credential + admin's Keycloak token in the admin group, TOTP, allowed IP
    subject_from: verified Keycloak token
    status: planned
    enforced: false
    operations:
      - listAccounts
      - getAccount
      - suspendAccount
      - reactivateAccount
      - setAccountQuota
      - forcePasswordReset
      - scheduleDeletion
      - cancelDeletion
      - readAudit

  pm-token:
    description: Password managers (Bitwarden etc.) acting for one user. Parked with PR 10 (2026-11-15).
    credential: Per-user token, hashed at rest, revocable
    subject_from: the token's owner
    status: planned
    enforced: false
    operations:
      - pmCreateRandomAliasSimpleLoginShape
      - pmCreateAliasAddyShape

  personal-token:
    description: Personal API tokens and the MCP server (M10, PR 32, deferred until an actual integration needs it). A subset of portal, read-only first.
    credential: Per-user scoped, IP-limited, short-lived token
    subject_from: the token's owner
    status: planned
    enforced: false
    operations:
      - listOwnAliases

  monitoring:
    description: health-check.sh and the PR 13 health contract, once they call the control plane over HTTP. Metrics (PR 27) are deferred; the first read-only mailcow key belongs to PR 34's message trace.
    credential: Bearer token + source IP
    subject_from: n/a
    status: implemented (MONITORING_TOKEN, MONITORING_CLIENTS=127.0.0.1). Used by health-check.sh through `python -m broker.probe` inside the broker container (PR 13)
    enforced: true
    operations:
      - upstreamCheck
      - health

# Operations that need no caller credential at all.
public:
  - healthz

# Groups used by the CI checks.
lifecycle_operations:
  - suspendAccount
  - reactivateAccount
  - setAccountQuota
  - forcePasswordReset
  - scheduleDeletion
  - cancelDeletion
