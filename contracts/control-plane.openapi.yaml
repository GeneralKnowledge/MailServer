# Avedeus control plane: the service contract.
#
# The control plane is the broker in broker/ (audit fix 7, grown in PR 9).
# Operations marked `x-avedeus-status: implemented` exist in broker/ now and
# CI checks that the broker's routes match them exactly. Operations marked
# `planned` are the agreed shape for the PR named in `x-avedeus-pr`; that PR
# may refine the details (fields, status codes) but not widen who may call
# them, which is fixed in capabilities.yaml.
#
# Nothing here is proven on the Oracle server yet.
openapi: 3.1.0
info:
  title: Avedeus control plane
  version: 0.1.0
  description: |
    The only component that holds upstream credentials (ADR 0003). Callers
    authenticate with their own credential and may use only the operations
    their row in capabilities.yaml grants (enforced from PR 9).

    Conventions:
    - Errors are always `{"ok": false, "kind": <ErrorKind>, "detail": <text>}`.
    - State-changing operations take an `Idempotency-Key` header; a repeat
      with the same key returns the first result (PR 9). It is required on
      planned operations and optional on createMailbox, which predates it.
    - The subject of a portal or token operation comes from the verified
      Keycloak token or the token's owner, never from a request field.
    - Every state-changing call and every refused call writes one audit event
      (audit-event.schema.json).
servers:
  - url: http://172.30.240.11:8100
    description: Internal only, on avedeus-edge. No published port.

tags:
  - name: health
  - name: signup
  - name: aliases
    description: Parked with PR 10 (2026-11-15). Kept as a sketch; not a planned deliverable.
  - name: password-manager
    description: Parked with PR 10 (2026-11-15). Kept as a sketch; not a planned deliverable.
  - name: lifecycle
    description: Admin-only. Never granted to the signup caller (ADR 0010).
  - name: audit

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness. No upstream call, no authentication.
      x-avedeus-status: implemented
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {const: true}

  /v1/upstream:
    get:
      operationId: upstreamCheck
      tags: [health]
      summary: Checks that the mailcow key and IP allow-list work.
      description: |
        Kept for manual checks. health-check.sh uses /v1/health, which
        includes the same mailcow check.
      x-avedeus-status: implemented
      responses:
        "200":
          description: mailcow answered with this key.
          content:
            application/json:
              schema:
                type: object
                required: [ok, mailcow_version]
                properties:
                  ok: {const: true}
                  mailcow_version: {type: string}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/health:
    get:
      operationId: health
      tags: [health]
      summary: Health of the control plane and every adapter, in one shape.
      description: |
        Implemented in PR 9; since PR 13 health-check.sh reads it every 15
        minutes (via `python -m broker.probe`) and alerts once per component
        that is degraded or down. An adapter answering slower than 5 s is
        `degraded`; a control-plane database that can't take its write lock is
        `down`.
      x-avedeus-status: implemented
      responses:
        "200":
          description: Overall and per-adapter health.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}

  /v1/addresses/check:
    post:
      operationId: checkAddress
      tags: [signup]
      summary: Is <local_part>@<the one mail domain> valid and free?
      x-avedeus-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [local_part]
              additionalProperties: false
              properties:
                local_part: {type: string, maxLength: 64}
      responses:
        "200":
          description: Validity and availability. `valid=false` carries a reason and no upstream call is made.
          content:
            application/json:
              schema:
                type: object
                required: [ok, valid, reason, taken, mailbox]
                additionalProperties: false
                properties:
                  ok: {const: true}
                  valid: {type: boolean}
                  reason: {type: [string, "null"]}
                  taken: {type: boolean, description: A mailbox or alias already uses the address.}
                  mailbox: {type: boolean, description: The address is a mailbox.}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/mailboxes:
    post:
      operationId: createMailbox
      tags: [signup]
      summary: Create a mailbox on the one mail domain.
      description: |
        The broker enforces the fixed domain, username rules, reserved names,
        the quota ceiling and a daily creation cap whatever the caller sends.
        Superseded by createAccount (PR 12). When the identity provider is on,
        it answers 409 `conflict`: a mailbox without its Keycloak user would be
        an account nobody can sign in to.

        Idempotency-Key is optional here (it predates the convention); the
        sign-up app sends one per invitation claim. A repeat with the same key
        and request replays the first result; the same key with a different
        request is a 409 `conflict`. Failed attempts leave no record, so they
        can be retried with the same key. Without a key, a lost mailcow reply
        is still handled by checking whether the mailbox exists.
      x-avedeus-status: implemented
      x-avedeus-audit: mailbox.create
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [local_part, password, quota_mb]
              additionalProperties: false
              properties:
                local_part: {type: string, maxLength: 64}
                password: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
                name: {type: string, maxLength: 100, default: ""}
                quota_mb: {type: integer}
      responses:
        "201":
          description: Created (or confirmed to exist after mailcow's reply was lost).
          content:
            application/json:
              schema:
                type: object
                required: [ok, address]
                additionalProperties: false
                properties:
                  ok: {const: true}
                  address: {type: string, format: email}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/me:
    get:
      operationId: getOwnAccount
      tags: [portal]
      summary: The signed-in user's own account (address, name, quota, state).
      description: |
        PR 14. The portal passes the user's Keycloak access token in
        `X-User-Token`; the control plane verifies its signature (realm JWKS),
        issuer, expiry and that it was issued to the portal client, and takes
        the user only from its `sub` via the identity link. A request field
        can never name another user. Read-only; refused tokens are audited.
      x-avedeus-status: implemented
      x-avedeus-pr: 14
      security: [{callerToken: [], userToken: []}]
      parameters:
        - {name: X-User-Token, in: header, required: true, schema: {type: string, maxLength: 8192}}
      responses:
        "200":
          description: The user's own account.
          content:
            application/json:
              schema:
                type: object
                required: [ok, address, name, quota_mb, used_mb, active]
                additionalProperties: false
                properties:
                  ok: {const: true}
                  address: {type: string, format: email}
                  name: {type: string, maxLength: 100}
                  quota_mb: {type: integer}
                  used_mb: {type: integer}
                  active: {type: boolean}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/trace:
    get:
      operationId: traceMessage
      tags: [diagnostics]
      summary: Read-only, admin-only message trace across mailcow's logs.
      description: |
        PR 34. Follows messages by Postfix queue ID and Message-ID across
        mailcow's Postfix log, Rspamd history, quarantine, mail queue and
        Dovecot delivery log, and explains each stage it can establish:
        rejected during SMTP (blocklist, unknown recipient, spam filter,
        policy), accepted, spam check, quarantined, deferred, accepted by the
        destination server, delivered to a mailbox (with folder where known),
        bounced, still queued; or that nothing matched in the retained log.

        Read-only: changes nothing, reads mailcow with its own read-only key,
        and never returns message content or subjects. Every answer carries
        the limits of what it can tell and the oldest log line searched.
        Every trace is audited (counts only). At least one of the filters,
        or just a window, may be given.
      x-avedeus-status: implemented
      x-avedeus-pr: 34
      x-avedeus-audit: message.trace
      security: [{callerToken: [], userToken: []}]
      parameters:
        - {name: X-User-Token, in: header, required: false, schema: {type: string, maxLength: 8192}}
        - {name: address, in: query, required: false, schema: {type: string, maxLength: 254}}
        - {name: message_id, in: query, required: false, schema: {type: string, maxLength: 998}}
        - {name: hours, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 720, default: 24}}
      responses:
        "200":
          description: What could be established, and what could not.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TraceResult"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/accounts:
    post:
      operationId: createAccount
      tags: [signup]
      summary: Redeem an invitation; creates the identity, then the mailbox.
      description: |
        With IDENTITY_PROVIDER=keycloak (PR 12): checks the address is free in
        mailcow, creates the Keycloak user (group `users`, the chosen password,
        email verified), records the link, then creates the mailbox with
        Keycloak as its login source and a random mailbox password nobody
        knows. Mail clients then use mailcow app passwords (ADR 0015), which
        `app_password_required` tells the sign-up page. If mailcow
        definitively refuses, the new Keycloak user is removed again; after a
        lost reply the identity is kept and a retry with the same key
        continues. An existing Keycloak user is never adopted.

        Without an identity provider it creates the mailbox with mailcow's
        own login, exactly like createMailbox.

        The same rules, quota ceiling and daily cap as createMailbox apply.
        `invitation` is an opaque reference recorded in the audit log, never
        the invitation's secret token.
      x-avedeus-status: implemented
      x-avedeus-pr: 12
      x-avedeus-audit: account.create
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [local_part, password, quota_mb, invitation]
              additionalProperties: false
              properties:
                local_part: {type: string, maxLength: 64}
                password: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
                name: {type: string, maxLength: 100, default: ""}
                quota_mb: {type: integer}
                invitation:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: "^[A-Za-z0-9_-]+$"
                  description: Opaque invitation reference; never the raw token.
      responses:
        "201":
          description: Account created (or confirmed to exist after mailcow's reply was lost).
          content:
            application/json:
              schema:
                type: object
                required: [ok, address, app_password_required]
                additionalProperties: false
                properties:
                  ok: {const: true}
                  address: {type: string, format: email}
                  app_password_required: {type: boolean}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    get:
      operationId: listAccounts
      tags: [lifecycle]
      summary: Accounts with mailbox state, quota and use, created time (read-only).
      description: |
        PR 15. mailcow's mailboxes on the mail domain (read with the
        read-only key when one is set), with whether each is linked to a
        Keycloak identity. Changes nothing and is not audited. Admin calls
        carry the admin's verified Keycloak token (ADR 0020).
      x-avedeus-status: implemented
      x-avedeus-pr: 15
      security: [{callerToken: [], userToken: []}]
      parameters:
        - {name: X-User-Token, in: header, required: false, schema: {type: string, maxLength: 8192}}
      responses:
        "200":
          description: Account list.
          content:
            application/json:
              schema:
                type: object
                required: [ok, identity_provider, accounts]
                additionalProperties: false
                properties:
                  ok: {const: true}
                  identity_provider: {enum: [none, keycloak]}
                  accounts:
                    type: array
                    items:
                      type: object
                      required: [address, name, quota_mb, used_mb, active, state, created, identity_linked,
                                 deletion_due]
                      additionalProperties: false
                      properties:
                        address: {type: string, format: email}
                        name: {type: string, maxLength: 100}
                        quota_mb: {type: integer}
                        used_mb: {type: integer}
                        active: {type: boolean}
                        state: {$ref: "#/components/schemas/AccountState"}
                        created: {type: string, maxLength: 32}
                        identity_linked: {type: boolean}
                        deletion_due: {type: [string, "null"], format: date-time}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/accounts/{account}:
    parameters: [{$ref: "#/components/parameters/Account"}]
    get:
      operationId: getAccount
      tags: [lifecycle]
      summary: One account, its identity, a pending deletion and its audit history (read-only).
      description: |
        PR 16. Not audited. `deletion.newer_backup` says whether a backup that
        started after the deletion was scheduled has completed (ADR 0021).
      x-avedeus-status: implemented
      x-avedeus-pr: 16
      security: [{callerToken: [], userToken: []}]
      parameters:
        - $ref: "#/components/parameters/UserToken"
      responses:
        "200":
          description: Account.
          content:
            application/json:
              schema:
                type: object
                required: [ok, address, name, quota_mb, used_mb, active, state, identity, deletion, history]
                additionalProperties: false
                properties:
                  ok: {const: true}
                  address: {type: string, format: email}
                  name: {type: string, maxLength: 100}
                  quota_mb: {type: integer}
                  used_mb: {type: integer}
                  active: {type: boolean}
                  state: {$ref: "#/components/schemas/AccountState"}
                  identity:
                    description: Null when the identity provider is off.
                    type: [object, "null"]
                    required: [linked, enabled, password_reset_required]
                    additionalProperties: false
                    properties:
                      linked: {type: boolean}
                      enabled: {type: [boolean, "null"]}
                      password_reset_required: {type: [boolean, "null"]}
                  deletion:
                    type: [object, "null"]
                    required: [scheduled_at, due_at, newer_backup]
                    additionalProperties: false
                    properties:
                      scheduled_at: {type: string, format: date-time}
                      due_at: {type: string, format: date-time}
                      newer_backup: {type: boolean}
                  history:
                    description: The newest 50 audit events about this address (audit-event.schema.json).
                    type: array
                    items: {type: object}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/accounts/{account}/suspend:
    parameters: [{$ref: "#/components/parameters/Account"}]
    post:
      operationId: suspendAccount
      tags: [lifecycle]
      summary: Keycloak user disabled and signed out; mailcow login off (mail keeps arriving unless stop_receiving).
      description: |
        PR 16, ADR 0021. mailcow state `login_disabled` (its "disallow
        login", active=2) refuses the password, app passwords and webmail
        sign-in while mail keeps arriving (roadmap D8); `stop_receiving`
        turns the mailbox fully off (active=0). App passwords are blocked,
        not deleted, so reactivating restores them (a named deviation from
        the earlier "revoked"; ADR 0021).
      x-avedeus-status: implemented
      x-avedeus-pr: 16
      x-avedeus-audit: account.suspend
      security: [{callerToken: [], userToken: []}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                stop_receiving: {type: boolean, default: false}
      responses:
        "200": {$ref: "#/components/responses/LifecycleState"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/accounts/{account}/reactivate:
    parameters: [{$ref: "#/components/parameters/Account"}]
    post:
      operationId: reactivateAccount
      tags: [lifecycle]
      summary: mailcow login on, Keycloak user enabled. Refused while a deletion is scheduled.
      x-avedeus-status: implemented
      x-avedeus-pr: 16
      x-avedeus-audit: account.reactivate
      security: [{callerToken: [], userToken: []}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserToken"
      responses:
        "200": {$ref: "#/components/responses/LifecycleState"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/accounts/{account}/quota:
    parameters: [{$ref: "#/components/parameters/Account"}]
    put:
      operationId: setAccountQuota
      tags: [lifecycle]
      summary: Set the mailbox quota (1 to MAX_QUOTA_MB, and not below what it already uses).
      x-avedeus-status: implemented
      x-avedeus-pr: 16
      x-avedeus-audit: account.quota
      security: [{callerToken: [], userToken: []}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quota_mb]
              additionalProperties: false
              properties:
                quota_mb: {type: integer, minimum: 1}
      responses:
        "200":
          description: Quota set.
          content:
            application/json:
              schema:
                type: object
                required: [ok, address, quota_mb]
                additionalProperties: false
                properties:
                  ok: {const: true}
                  address: {type: string, format: email}
                  quota_mb: {type: integer}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/accounts/{account}/password-reset:
    parameters: [{$ref: "#/components/parameters/Account"}]
    post:
      operationId: forcePasswordReset
      tags: [lifecycle]
      summary: Keycloak asks for a new password at the next sign-in; current sessions end.
      description: |
        PR 16. Needs a linked Keycloak identity (409 otherwise: mailcow's
        admin sets passwords of accounts without one). Mail apps use app
        passwords (ADR 0015) and are not affected; suspend to stop them.
      x-avedeus-status: implemented
      x-avedeus-pr: 16
      x-avedeus-audit: account.password_reset
      security: [{callerToken: [], userToken: []}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserToken"
      responses:
        "200":
          description: Reset required.
          content:
            application/json:
              schema:
                type: object
                required: [ok, address, required_action]
                additionalProperties: false
                properties:
                  ok: {const: true}
                  address: {type: string, format: email}
                  required_action: {const: UPDATE_PASSWORD}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/accounts/{account}/deletion:
    parameters: [{$ref: "#/components/parameters/Account"}]
    post:
      operationId: scheduleDeletion
      tags: [lifecycle]
      summary: Suspend now, delete after the grace period and only after a newer backup exists.
      description: |
        PR 16, ADR 0021. The account is suspended (mail keeps arriving, so a
        cancelled deletion loses nothing) and recorded. The deletion job
        (`python -m broker.purge`, daily) deletes the mailbox and the
        Keycloak user once `due_at` has passed and a backup that started
        after `needs_backup_after` has completed.
      x-avedeus-status: implemented
      x-avedeus-pr: 16
      x-avedeus-audit: account.deletion_scheduled
      security: [{callerToken: [], userToken: []}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserToken"
      responses:
        "202":
          description: Deletion scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [ok, address, state, identity, due_at, needs_backup_after]
                additionalProperties: false
                properties:
                  ok: {const: true}
                  address: {type: string, format: email}
                  state: {$ref: "#/components/schemas/AccountState"}
                  identity: {enum: [disabled, not_linked]}
                  due_at: {type: string, format: date-time}
                  needs_backup_after: {type: string, format: date-time}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
    delete:
      operationId: cancelDeletion
      tags: [lifecycle]
      summary: Cancel a scheduled deletion; the account returns to the state it had before.
      x-avedeus-status: implemented
      x-avedeus-pr: 16
      x-avedeus-audit: account.deletion_cancelled
      security: [{callerToken: [], userToken: []}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserToken"
      responses:
        "200": {$ref: "#/components/responses/LifecycleState"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}

  /v1/me/aliases:
    get:
      operationId: listOwnAliases
      tags: [aliases]
      summary: The signed-in user's aliases.
      x-avedeus-status: planned
      x-avedeus-pr: 10
      responses:
        "200": {description: Aliases.}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createOwnAlias
      tags: [aliases]
      summary: Random or custom alias, optional expiry, within per-user limits.
      x-avedeus-status: planned
      x-avedeus-pr: 10
      x-avedeus-audit: alias.create
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: {enum: [random, custom]}
                local_part: {type: string, maxLength: 64}
                expires_at: {type: string, format: date-time}
                note: {type: string, maxLength: 200}
      responses:
        "201": {description: Alias created.}
        default: {$ref: "#/components/responses/Error"}

  /v1/me/aliases/{alias}:
    parameters: [{$ref: "#/components/parameters/Alias"}]
    patch:
      operationId: updateOwnAlias
      tags: [aliases]
      summary: Turn on or off, change expiry or note.
      x-avedeus-status: planned
      x-avedeus-pr: 10
      x-avedeus-audit: alias.update
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Updated.}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteOwnAlias
      tags: [aliases]
      x-avedeus-status: planned
      x-avedeus-pr: 10
      x-avedeus-audit: alias.delete
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Error"}

  /api/alias/random/new:
    post:
      operationId: pmCreateRandomAliasSimpleLoginShape
      tags: [password-manager]
      summary: SimpleLogin-compatible endpoint so password managers can create an alias for the token's owner.
      description: Copies the API shape only; SimpleLogin itself is not used (ADR 0005, 0011).
      x-avedeus-status: planned
      x-avedeus-pr: 10
      x-avedeus-audit: alias.create
      responses:
        "201": {description: Alias created.}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/aliases:
    post:
      operationId: pmCreateAliasAddyShape
      tags: [password-manager]
      summary: addy-compatible endpoint so password managers can create an alias for the token's owner.
      description: Copies the API shape only; addy.io itself is rejected (ADR 0011).
      x-avedeus-status: planned
      x-avedeus-pr: 10
      x-avedeus-audit: alias.create
      responses:
        "201": {description: Alias created.}
        default: {$ref: "#/components/responses/Error"}

  /v1/audit:
    get:
      operationId: readAudit
      tags: [audit]
      summary: Audit events, newest first, filterable by action and outcome (read-only).
      description: |
        PR 15 (pulled forward from PR 28 in its smallest form, for the admin
        console): the newest events, optionally only those whose action is
        or starts with `action` (e.g. `account`) and with one outcome. PR 28
        adds filters by account and time. Not audited itself.
      x-avedeus-status: implemented
      x-avedeus-pr: 15
      security: [{callerToken: [], userToken: []}]
      parameters:
        - {name: X-User-Token, in: header, required: false, schema: {type: string, maxLength: 8192}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: action, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: outcome, in: query, required: false, schema: {enum: [ok, refused, failed]}}
      responses:
        "200":
          description: Events in the shape of audit-event.schema.json.
          content:
            application/json:
              schema:
                type: object
                required: [ok, events]
                additionalProperties: false
                properties:
                  ok: {const: true}
                  events: {type: array, items: {type: object}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    callerToken:
      type: http
      scheme: bearer
      description: |
        Each caller's own credential (SIGNUP_TOKEN, MONITORING_TOKEN, ADMIN_TOKEN, ...),
        also checked against that caller's allowed source addresses. Which
        operations each caller may use is capabilities.yaml, enforced since
        PR 9. 401 = no valid token; 403 = wrong address or operation not in
        the caller's row.
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The end user's Keycloak access token, passed by portal and admin (from PR 12).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    Account:
      name: account
      in: path
      required: true
      schema: {type: string, maxLength: 254, description: "The mailbox address on the mail domain (PR 16)."}
    UserToken:
      name: X-User-Token
      in: header
      required: false
      description: The admin's Keycloak access token (ADR 0020); not needed for break-glass from 127.0.0.1.
      schema: {type: string, maxLength: 8192}
    Alias:
      name: alias
      in: path
      required: true
      schema: {type: string, format: email}

  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    LifecycleState:
      description: The account's state after the change (PR 16).
      content:
        application/json:
          schema:
            type: object
            required: [ok, address, state, identity]
            additionalProperties: false
            properties:
              ok: {const: true}
              address: {type: string, format: email}
              state: {$ref: "#/components/schemas/AccountState"}
              identity:
                description: What happened to the linked Keycloak user, if any.
                enum: [enabled, disabled, not_linked]

  schemas:
    AccountState:
      description: |
        mailcow's mailbox state. active (1); login_disabled (2, "disallow
        login": mail arrives, no password, app password or webmail sign-in
        works); inactive (0, mail is refused).
      enum: [active, login_disabled, inactive]
    TraceStage:
      type: object
      required: [stage, time, detail]
      properties:
        stage:
          enum: [never_reached, window_short, rejected_smtp, accepted, spam_check, quarantined,
                 deferred, sent_remote, delivered_local, bounced, queued]
        time: {type: [number, "null"]}
        recipient: {type: string}
        detail: {type: string}
    TraceResult:
      type: object
      required: [ok, found, window, messages, rejections, truncated, notes, limits]
      additionalProperties: false
      properties:
        ok: {const: true}
        found: {type: boolean}
        window:
          type: object
          required: [since, until, oldest_log_entry, postfix_lines]
          properties:
            since: {type: number}
            until: {type: number}
            oldest_log_entry: {type: [number, "null"]}
            postfix_lines: {type: integer}
        messages:
          type: array
          maxItems: 50
          items:
            type: object
            required: [queue_id, message_id, from, to, received_at, stages]
            additionalProperties: false
            properties:
              queue_id: {type: string}
              message_id: {type: [string, "null"]}
              from: {type: [string, "null"]}
              to: {type: array, items: {type: string}}
              received_at: {type: number}
              stages: {type: array, items: {$ref: "#/components/schemas/TraceStage"}}
        rejections:
          type: array
          maxItems: 50
          items:
            type: object
            required: [stage, time, to, reason_kind, detail]
            properties:
              stage: {const: rejected_smtp}
              time: {type: number}
              from: {type: [string, "null"]}
              to: {type: string}
              reason_kind: {enum: [blocklist, unknown_recipient, spam_filter, policy]}
              detail: {type: string}
        truncated: {type: boolean}
        notes: {type: array, items: {$ref: "#/components/schemas/TraceStage"}}
        limits: {type: array, items: {type: string}, minItems: 1}
    ErrorKind:
      type: string
      enum:
        - invalid       # 422 request breaks a rule
        - password      # 422 mailcow or Keycloak rejected the password (policy)
        - taken         # 409 address already in use
        - limit         # 429 a cap was reached
        - unauthorized  # 401 missing or wrong credential
        - forbidden     # 403 caller or source not allowed, or operation not in its capabilities
        - auth          # 502 upstream refused our credential
        - unavailable   # 502 upstream unreachable or timed out
        - rejected      # 502 upstream refused the request
        - not_found     # 404 unknown route
        - conflict      # 409 idempotency key reused with a different request, or still in progress
    Error:
      type: object
      required: [ok, kind, detail]
      additionalProperties: false
      properties:
        ok: {const: false}
        kind: {$ref: "#/components/schemas/ErrorKind"}
        detail: {type: string, maxLength: 500}
    Health:
      type: object
      required: [status, checked_at, components]
      properties:
        status: {$ref: "#/components/schemas/HealthStatus"}
        checked_at: {type: string, format: date-time}
        components:
          type: object
          description: One entry per adapter (mailcow, keycloak, …) and the control plane's own DB.
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: {$ref: "#/components/schemas/HealthStatus"}
              detail: {type: string, maxLength: 500}
              latency_ms: {type: integer, minimum: 0}
    HealthStatus:
      enum: [ok, degraded, down]

security:
  - callerToken: []
